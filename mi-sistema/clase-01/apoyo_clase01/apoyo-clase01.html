<!-- <button type="submit" id="mi-boton"> Hacer clic aquí </button> -->

   <h2>Registro de Alumno</h2>
    <form id="miFormulario" action="https://httpbin.org" method="POST">
    
    <div class="campo">
      <label for="nombre">Nombre completo (Obligatorio):</label>
      <input type="text" id="nombre" name="usuario_nombre" required minlength="3" placeholder="Ej. Juan Pérez">
    </div>

    <div class="campo">
      <label for="correo">Correo Electrónico:</label>
      <input type="email" id="correo" name="usuario_correo" required placeholder="correo@ejemplo.com">
    </div>

    <button type="submit">Enviar al Servidor</button>
   </form>
  <div id="consola"></div>

  <script>
    const formulario = document.getElementById('miFormulario');
    const consola = document.getElementById('consola');

    formulario.addEventListener('submit', function(evento) {
      // Interceptamos el envío original solo para mostrarle al alumno los datos en pantalla
      evento.preventDefault(); 
      
      // PASO 1: El navegador ya validó (si falta algo, este código nunca se ejecuta)
      
      // PASO 2: Recopilación de datos (Serialization)
      const datos = new FormData(formulario);
      let datosEstructurados = "<strong>Datos Recopilados (Paso 2):</strong><br>";
      
      datos.forEach((valor, llave) => {
        datosEstructurados += `${llave}: ${valor}<br>`;
      });

      // Mostramos el resultado del Paso 2 en la página
      consola.innerHTML = datosEstructurados + "<br><em>¡Paso 3 listo! Enviando datos reales al servidor...</em>";
      consola.style.display = "block";

 
    });
  </script>
